<div class="login">
  <button type="button" class="icon-btn login__theme" (click)="toggleTheme()" data-testid="login-theme"
          [attr.aria-label]="currentTheme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
          [attr.data-tip]="currentTheme() === 'dark' ? 'Light theme' : 'Dark theme'" data-tip-below data-tip-end>
    <app-icon [name]="currentTheme() === 'dark' ? 'sun' : 'moon'" [size]="20" />
  </button>

  <main class="login__main">
    <a routerLink="/" class="login__brand" aria-label="Quorum home">
      <app-brand-logo [size]="30" />
    </a>

    <section class="login-card card" aria-labelledby="signin-title">
      <div class="login-card__mascot" aria-hidden="true">
        <app-mascot [size]="112" [action]="mascotAction()" [interactive]="false" />
      </div>

      <div class="login-header">
        <h1 id="signin-title">Sign in</h1>
        <p class="muted">Use your trading account credentials to continue.</p>
      </div>

      @if (errorMessage(); as error) {
        <div class="banner error" role="alert" data-testid="error-message">{{ error }}</div>
      }

      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" formControlName="username" data-testid="username-input" class="form-input"
                 autocomplete="username" autocapitalize="none" spellcheck="false" (keydown.enter)="onSubmit()"
                 [class.form-input--error]="usernameError()"
                 [attr.aria-invalid]="usernameError() ? true : null"
                 [attr.aria-describedby]="usernameError() ? 'username-error' : null" />
          @if (usernameError(); as error) {
            <div class="field-error" id="username-error" data-testid="username-error">{{ error }}</div>
          }
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input [type]="showPassword() ? 'text' : 'password'" id="password" formControlName="password" data-testid="password-input"
                   class="form-input" autocomplete="current-password" (keydown.enter)="onSubmit()"
                   [class.form-input--error]="passwordError()"
                   [attr.aria-invalid]="passwordError() ? true : null"
                   [attr.aria-describedby]="passwordError() ? 'password-error' : null" />
            <button type="button" class="password-toggle" (click)="togglePasswordVisibility()"
                    [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
          @if (passwordError(); as error) {
            <div class="field-error" id="password-error" data-testid="password-error">{{ error }}</div>
          }
        </div>

        <button type="submit" data-testid="submit-button" class="primary lg submit-button"
                [disabled]="!canSubmit()" [attr.aria-busy]="isSubmitting()">
          @if (lockoutSecondsRemaining() > 0) {
            {{ lockoutButtonText() }}
          } @else if (isSubmitting()) {
            Signing in...
          } @else {
            Sign in
          }
        </button>
      </form>
    </section>
  </main>
</div>

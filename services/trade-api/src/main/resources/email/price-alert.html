<h1 class="ink" style="margin:8px 0 12px 0;font-size:24px;line-height:1.3;font-weight:700;text-align:center;color:#0a0a0a;">Your price alert was triggered</h1>
<p class="ink" style="margin:0 0 16px 0;font-size:16px;line-height:1.6;text-align:center;color:#0a0a0a;">{{body}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="chip" style="background-color:#f5f5f5;border:1px solid #e5e5e5;padding:14px 16px;font-size:14px;line-height:1.6;color:#262626;font-family:'Courier New',Courier,monospace;">
    <strong>{{subject}}</strong><br>
    <span class="muted" style="color:#737373;">Switch the alert back on from the Alerts page if you want to be told again. Sent {{sentAt}}</span>
  </td></tr>
</table>

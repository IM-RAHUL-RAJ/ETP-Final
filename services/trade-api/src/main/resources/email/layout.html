<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{subject}}</title>
<style>
  /* Dark mode for clients that support it; every colour is also inlined below for the ones that do not. */
  @media (prefers-color-scheme: dark) {
    .bg { background-color: #0a0a0a !important; }
    .card { background-color: #121212 !important; border-color: #fafafa !important; }
    .ink { color: #fafafa !important; }
    .muted { color: #a3a3a3 !important; }
    .chip { background-color: #1c1c1c !important; color: #e5e5e5 !important; border-color: #2a2a2a !important; }
    .cta { background-color: #fafafa !important; }
    .cta a { color: #171717 !important; }
    .auto { background-color: #fafafa !important; }
    .auto div { color: #171717 !important; }
  }
  @media only screen and (max-width: 600px) {
    .wrap { width: 100% !important; }
    .pad { padding: 24px 18px !important; }
  }
</style>
</head>
<body class="bg" style="margin:0;padding:0;background-color:#ffffff;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" style="background-color:#ffffff;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" class="wrap" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px;max-width:560px;">
        <tr>
          <td style="padding:0 4px 14px 4px;font-family:'Courier New',Courier,monospace;font-size:18px;font-weight:700;letter-spacing:0.12em;color:#0a0a0a;" class="ink">
            <span style="display:inline-block;width:10px;height:10px;background-color:#d71921;margin-right:8px;"></span>QUORUM
          </td>
        </tr>
        <tr>
          <td class="card pad" style="background-color:#ffffff;border:2px solid #0a0a0a;padding:32px 36px;font-family:'Courier New',Courier,monospace;color:#0a0a0a;">
            {{{banner}}}
            <div align="center" style="padding-bottom:6px;">
              <!-- The mascot is attached to the message itself (cid:), so it shows with no external image to load. -->
              <img src="{{mascotUrl}}" width="128" height="128" alt="{{mascotName}} says: {{subject}}" style="display:block;width:128px;height:128px;border:0;image-rendering:pixelated;">
            </div>
            {{{content}}}
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:28px auto 8px auto;">
              <tr>
                <td align="center" class="cta" style="background-color:#171717;">
                  <a href="{{ctaUrl}}" style="display:inline-block;padding:13px 28px;font-family:'Courier New',Courier,monospace;font-size:15px;font-weight:700;letter-spacing:0.04em;color:#fafafa;text-decoration:none;">{{ctaLabel}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="muted" style="padding:18px 8px 0 8px;font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.6;color:#737373;text-align:center;">
            You are receiving this because of activity on your Quorum account.<br>
            Change which messages you get in <a href="{{settingsUrl}}" style="color:#737373;text-decoration:underline;">Settings</a>.<br>
            Quorum is a simulated trading platform. Nothing here is investment advice, and no real money moves.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>

spring.application.name=trade-api

# --- Where the settings come from ---
# Nothing environment-specific is written in this file. Every ${NAME} below is an environment variable
# (listed in .env.example at the repository root). When the service is started from its own folder, the
# repository's .env is read too, so `mvn spring-boot:run` works without exporting anything. A variable
# that is already in the process environment wins over the file. A ${NAME} with no value stops start-up.
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]

server.port=${ORDER_SERVICE_PORT}

# One database (DB_NAME), two schemas: this service works in the trade schema.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA_TRADE},public
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations=classpath*:mapper/**/*.xml

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.algorithm=${JWT_ALGORITHM}
app.auth.jwt.issuer=${JWT_ISSUER}
app.auth.base-url=${AUTH_SERVICE_URL}:${AUTH_SERVICE_PORT}

# --- Kafka Producer (idempotent, acks=all) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# --- Kafka consumers ---
# Every consumer names its group explicitly (there is deliberately no spring.kafka.consumer.group-id):
# a group id names a logical consumer, so each module keeps its own offsets even though they share
# this process, and no group is ever shared by two modules. They are listed in each module's README.
#   watchlist-service    reads market-data    (quote cache + price alerts)
#   notification-service reads trade-events   (customer notifications)
#   portfolio-service    reads trade-events   (realised profit and loss)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=latest
# Offsets are committed by the listener container only after the listener method has returned.
spring.kafka.consumer.enable-auto-commit=false
app.kafka.groups.watchlist=${KAFKA_WATCHLIST_GROUP}
app.kafka.groups.notifications=${KAFKA_NOTIFICATIONS_GROUP}
app.kafka.groups.portfolio=${KAFKA_PORTFOLIO_GROUP}
app.kafka.topics.market-data=${MARKET_DATA_TOPIC}
app.kafka.topics.trade-events=${TRADE_EVENTS_TOPIC}
app.market-data.consumer.enabled=${MARKET_DATA_CONSUMER_ENABLED}
app.notifications.consumer.enabled=${NOTIFICATIONS_CONSUMER_ENABLED}
app.portfolio.consumer.enabled=${PORTFOLIO_CONSUMER_ENABLED}

mybatis.configuration.map-underscore-to-camel-case=true

# --- Customer notifications ---
# How often the dispatcher looks for notifications that are queued, and how often one is retried.
app.notifications.dispatch-interval-ms=${NOTIFICATIONS_DISPATCH_INTERVAL_MS}
app.notifications.batch-size=50
app.notifications.max-attempts=5
app.notifications.retry-backoff-seconds=30
# A held notification (no usable contact for the chosen channel) is looked at again after this long.
app.notifications.held-retry-seconds=300
# E-mail is sent over SMTP only when SMTP_HOST is set; otherwise the channel logs a masked stub line.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.notifications.mail.from=${SMTP_FROM:}

# --- Watchlists and price alerts ---
# Cap per account, counting every alert it still holds (active or finished): finished alerts are
# removed by the customer, so create-and-cancel loops cannot grow the table.
app.alerts.max-per-account=${ALERTS_MAX_PER_ACCOUNT}
app.alerts.index-refresh-ms=30000
app.alerts.handover-retry-ms=30000
app.alerts.max-handover-attempts=5

# --- Portfolio and P&L ---
# The Fauxnance key is read from the environment and never reaches the browser.
app.fauxnance.base-url=${FAUXNANCE_BASE_URL}
app.fauxnance.api-key=${FAUXNANCE_API_KEY:}
app.fauxnance.connect-timeout-ms=2000
app.fauxnance.read-timeout-ms=4000
# A quote fetched this recently is reused (one batched call serves every caller in the window).
app.portfolio.quote-ttl-seconds=${PORTFOLIO_QUOTE_TTL_SECONDS}
# An observed price older than this is marked stale even if Fauxnance did not flag it.
app.portfolio.stale-after-seconds=${PORTFOLIO_STALE_AFTER_SECONDS}
# After a failed Fauxnance call, do not call it again for this long: saves quota and latency.
app.portfolio.provider-cooldown-seconds=${PORTFOLIO_PROVIDER_COOLDOWN_SECONDS}
app.portfolio.usage-cache-seconds=300
# --- Sprint 10 UI enhancements ---
# Where links and mascot pictures in e-mails point: the address customers use for the web app.
app.public.base-url=${FRONTEND_URL}:${FRONTEND_PORT}
# The most one add-funds or withdrawal can move. Funds are simulated; this only bounds a typo.
app.funds.max-per-movement=${FUNDS_MAX_PER_MOVEMENT}
# Candles for the watchlist chart are kept this long, so a chart click does not spend provider quota.
app.candles.cache-seconds=${CANDLES_CACHE_SECONDS}

# --- Automated trading ---
# Customers create strategies and switch them on in the app; each starts OFF and needs an explicit confirmation.
# Orders go through the Trade REST API with a one-minute token signed for the strategy's own account.
# app.automation.enabled is the platform kill switch: false and nothing trades, whatever customers have switched on.
app.automation.enabled=${AUTOMATION_ENABLED}
app.automation.trade-api-base-url=${ORDER_SERVICE_URL}:${ORDER_SERVICE_PORT}
app.automation.connect-timeout-ms=2000
app.automation.read-timeout-ms=4000
app.automation.history-size=500
# Demo button: a scripted price path that makes a running strategy trigger now. The order it places is REAL.
app.automation.simulation-enabled=${AUTOMATION_SIMULATION}
app.automation.max-per-account=10
# BUY at the ask plus this, SELL at the bid minus this (percent), so the executor fill rule is met.
app.automation.limit-buffer-percent=0.10
app.automation.reload-ms=30000

# --- Trade advice (advisory only) ---
app.advice.short-period=${ADVICE_SHORT_PERIOD}
app.advice.long-period=${ADVICE_LONG_PERIOD}

# --- In-app assistant (Gemini) ---
# The key is read from the environment only and is never logged, returned or committed. Without it the assistant
# still answers from the account's own data, in plain sentences.
app.assistant.gemini.api-key=${GEMINI_API_KEY:}
app.assistant.gemini.base-url=${GEMINI_BASE_URL}
app.assistant.gemini.model=${GEMINI_MODEL}
app.assistant.gemini.fallback-models=${GEMINI_FALLBACK_MODELS}
app.assistant.gemini.read-timeout-ms=8000
app.assistant.rate-per-minute=20

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-04-analytics-etl"
version = "0.1.0"
description = "Analytics and ingestion pipeline for Sprint 4"
requires-python = ">=3.10"

dependencies = [
    "duckdb",
    "requests",
    "pandas",
    "plotly",
    "python-dotenv",
    "psycopg2-binary"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fauxnance-pipeline = "analytics_etl.pipeline:main"
postgres-pipeline = "postgres_etl.pipeline:main"
sonar.projectKey=analytics-pipeline
sonar.projectName=Analytics ETL Pipeline
sonar.projectVersion=1.0

# Source and test directories (relative to this file)
sonar.sources=src
sonar.tests=tests

sonar.python.version=3.12

# Coverage XML generated by: pytest --cov=src --cov-report=xml:coverage.xml
# Run this before the sonar-scan-pipeline service, or the coverage metric shows 0%
sonar.python.coverage.reportPaths=coverage.xml

# Exclude generated and cache files
sonar.exclusions=**/__pycache__/**,**/*.egg-info/**,**/.pytest_cache/**

